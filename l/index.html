    <!-- هنا يبدأ كود معاينة الرابط في التطبيقات الداعمة لبطاقات Twitter/X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DAFFH LITE Navigator">

    <meta name="twitter:image" content="https://gps-rfq.github.io/assets/daffh-lite-preview.jpg">
    <!-- هنا نهاية كود معاينة الرابط -->


    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #111111;
            color: #ffffff;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #ff7f00;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 22px;
            background: #ff7f00;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>DAFFH LITE Navigator</h1>

    <p id="pageText1">
        This location link is designed to open with DAFFH LITE Navigator.
    </p>

    <p id="pageText2">
        If the app did not open automatically, make sure DAFFH LITE Navigator is installed on your device.
    </p>

    <a id="downloadButton"
       href="https://play.google.com/store/apps/details?id=com.rafeeq.daffah">
        Download the app
    </a>

</div>


<!-- هنا يبدأ كود تحديد لغة صفحة الويب حسب لغة المستخدم -->
<script>

    const translations = {

        ar: {
            text1: "تم تصميم رابط الموقع هذا ليتم فتحه باستخدام DAFFH LITE Navigator.",
            text2: "إذا لم يتم فتح التطبيق تلقائيًا، فتأكد من تثبيت DAFFH LITE Navigator على جهازك.",
            button: "تنزيل التطبيق"
        },

        en: {
            text1: "This location link is designed to open with DAFFH LITE Navigator.",
            text2: "If the app did not open automatically, make sure DAFFH LITE Navigator is installed on your device.",
            button: "Download the app"
        },

        fr: {
            text1: "Ce lien de localisation est conçu pour être ouvert avec DAFFH LITE Navigator.",
            text2: "Si l’application ne s’ouvre pas automatiquement, assurez-vous que DAFFH LITE Navigator est installé sur votre appareil.",
            button: "Télécharger l’application"
        },

        de: {
            text1: "Dieser Standortlink wurde zum Öffnen mit DAFFH LITE Navigator erstellt.",
            text2: "Wenn die App nicht automatisch geöffnet wurde, stellen Sie sicher, dass DAFFH LITE Navigator auf Ihrem Gerät installiert ist.",
            button: "App herunterladen"
        }

    };


    let userLanguage = (navigator.language || navigator.userLanguage || "en")
        .toLowerCase()
        .split("-")[0];


    if (!translations[userLanguage]) {
        userLanguage = "en";
    }


    const selectedLanguage = translations[userLanguage];


    document.getElementById("pageText1").textContent =
        selectedLanguage.text1;

    document.getElementById("pageText2").textContent =
        selectedLanguage.text2;

    document.getElementById("downloadButton").textContent =
        selectedLanguage.button;


    document.documentElement.lang = userLanguage;


    if (userLanguage === "ar") {
        document.documentElement.dir = "rtl";
        document.body.dir = "rtl";
    } else {
        document.documentElement.dir = "ltr";
        document.body.dir = "ltr";
    }

</script>
<!-- هنا نهاية كود تحديد لغة صفحة الويب حسب لغة المستخدم -->


</body>

</html>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #111111;
            color: #ffffff;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #ff7f00;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 22px;
            background: #ff7f00;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>DAFFH LITE Navigator</h1>

    <p id="pageText2">
        You must first download DAFFH LITE Navigator to view this location.
    </p>

    <a id="downloadButton"
       href="https://play.google.com/store/apps/details?id=com.rafeeq.daffah">
        Download from Google Play
    </a>

</div>


<!-- هنا يبدأ كود تحديد لغة صفحة الويب حسب لغة المستخدم -->
<script>

    const translations = {

        ar: {
            text2: "يجب تنزيل تطبيق DAFFH LITE Navigator أولا لعرض هذا الموقع.",
            button: "تنزيل من Google Play"
        },

        en: {
            text2: "You must first download DAFFH LITE Navigator to view this location.",
            button: "Download from Google Play"
        },

        fr: {
            text2: "Vous devez d’abord télécharger DAFFH LITE Navigator pour afficher cet emplacement.",
            button: "Télécharger depuis Google Play"
        },

        de: {
            text2: "Sie müssen zuerst DAFFH LITE Navigator herunterladen, um diesen Standort anzuzeigen.",
            button: "Von Google Play herunterladen"
        }

    };


    let userLanguage = (navigator.language || navigator.userLanguage || "en")
        .toLowerCase()
        .split("-")[0];


    if (!translations[userLanguage]) {
        userLanguage = "en";
    }


    const selectedLanguage = translations[userLanguage];


    document.getElementById("pageText2").textContent =
        selectedLanguage.text2;

    document.getElementById("downloadButton").textContent =
        selectedLanguage.button;


    document.documentElement.lang = userLanguage;


    if (userLanguage === "ar") {
        document.documentElement.dir = "rtl";
        document.body.dir = "rtl";
    } else {
        document.documentElement.dir = "ltr";
        document.body.dir = "ltr";
    }

</script>
<!-- هنا نهاية كود تحديد لغة صفحة الويب حسب لغة المستخدم -->


</body>

</html>

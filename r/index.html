    <style>

        a {
            display: inline-block;

            border-radius: 8px;
            font-weight: bold;
        }

<body>

<div class="container">

    <h1>رفيق الدرب</h1>

    <p>
        يتم فتح الموقع في تطبيق رفيق الدرب.
    </p>

    <p>
        إذا لم يكن التطبيق مثبتًا، يمكنك تنزيله من Google Play.
    </p>

    <a id="playStoreButton"
       href="https://play.google.com/store/apps/details?id=com.rafeeq.mokweila">
        تنزيل رفيق الدرب
    </a>

</div>

<script>
(function () {

    "use strict";

    const PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=com.rafeeq.mokweila";

    try {

        const params =
            new URLSearchParams(window.location.search);

        const x =
            params.get("x");

        const y =
            params.get("y");

        if (x === null || y === null) {
            return;
        }

        const latitude =
            Number(x);

        const longitude =
            Number(y);

        const valid =
            Number.isFinite(latitude) &&
            Number.isFinite(longitude) &&
            latitude >= -90 &&
            latitude <= 90 &&
            longitude >= -180 &&
            longitude <= 180;

        if (!valid) {
            return;
        }

        /*
         * لو تطبيق رفيق الدرب مثبت وAndroid App Links
         * متحقق منها، Android سيفتح التطبيق قبل تحميل
         * هذه الصفحة أصلًا.
         *
         * الوصول لهذا الكود غالبًا يعني أن التطبيق
         * غير مثبت أو أن الرابط فُتح داخل متصفح.
         */

        window.setTimeout(function () {

            try {

                window.location.href =
                    PLAY_STORE_URL;

            } catch (e) {
                // لا نفعل شيئًا
            }

        }, 1500);

    } catch (e) {
        // حماية فقط - الصفحة تظل تعمل بدون كراش
    }

})();
</script>

</body>
</html>
